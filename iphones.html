<!-- Tema claro/oscuro: se aplica ANTES de pintar para que no haya un
     destello del tema claro cuando el guardado es oscuro. Lee la misma
     clave de localStorage que app.js (nombre-tema); si no hay elección
     previa, el sitio arranca SIEMPRE en claro (se ignora la preferencia
     del sistema a propósito). -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('nombre-tema');
      if (t !== 'claro' && t !== 'oscuro') t = 'claro';
      document.documentElement.setAttribute('data-tema', t);

      // Marca que las apariciones al scrollear están habilitadas. Se pone
      // ACÁ, antes del primer pintado, porque es lo que deja las secciones
      // en opacity 0 desde el arranque: si la clase la pusiera app.js (que
      // corre al final del body) se vería un parpadeo del contenido ya
      // visible antes de ocultarse. Sin JS, sin IntersectionObserver o con
      // "reducir movimiento" activo, la clase no se pone y todo se ve
      // directo, sin animación.
      if ('IntersectionObserver' in window &&
          !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
        document.documentElement.classList.add('con-animacion');

        // RED DE SEGURIDAD: las secciones arrancan en opacity 0 y dependen
        // de que app.js las revele. Si app.js no llega a correr (un error
        // antes de revelarSecciones(), un archivo que no cargó), quedarían
        // invisibles PARA SIEMPRE. Este timeout saca la clase —y con ella
        // el ocultamiento— salvo que app.js haya avisado que tomó el
        // control poniendo data-anim="ok". Es lo que garantiza que el
        // contenido nunca desaparezca por una animación que no arrancó.
        window.setTimeout(function () {
          if (document.documentElement.dataset.anim !== 'ok') {
            document.documentElement.classList.remove('con-animacion');
          }
        }, 2500);
      }
    } catch (e) {
      document.documentElement.setAttribute('data-tema', 'claro');
    }
  })();
</script>
